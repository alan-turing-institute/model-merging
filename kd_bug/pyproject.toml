[project]
name = "kd-bug"
version = "0.1.0"
description = "Reproduction of the off-by-one in Axolotl's KD plugin target alignment"
requires-python = ">=3.12"
dependencies = [
    "axolotl==0.18.0",
    # axolotl 0.18.0 imports torchao unconditionally, but its own dependency
    # marker excludes it on aarch64. torchao ships a py3-none-any wheel.
    "torchao==0.17.0",
]

[tool.uv]
package = false
