[project]
name = "merge"
version = "0.1.0"
description = "A scrip to use mergekit to merge models"
readme = "README.md"
authors = [
    { name = "Justin McInroy", email = "jmcinroy@turing.ac.uk" },
    { name = "Mariusz Pietrzyk", email = "mpietrzyk@turing.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "mergekit",
    # Declared directly, though mergekit pulls it anyway: [tool.uv.sources]
    # applies only to a project's OWN dependencies, so without this line the
    # cu128 index below is silently ignored and the resolve falls back to
    # PyPI's cu130 wheels.
    "torch",
]

[tool.uv]
package = false

[tool.uv.sources]
mergekit = { git = "https://github.com/Zelys-DFKH/mergekit.git", rev = "fix/pydantic-schema-transformers5" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

# Isambard-AI (GH200, aarch64) runs driver 565.57.01, i.e. CUDA 12.7. PyPI's
# aarch64 torch wheels are built for CUDA 13.0 at every version we can use, so
# a default resolve gives torch+cu130 and torch.cuda.is_available() is False -
# inside a GPU allocation, with a "driver is too old" warning and no other
# symptom. Measured: 2.11.0+cu130 -> False, 2.11.0+cu128 -> True on a GH200.
#
# CUDA 12.x minor-version compatibility means any 12.x runtime works against a
# 12.7 driver, so the cu128 index is the fix. The hpc_sdk ships compat libs at
# .../cuda/12.6/compat, but they are 560.28.03 - OLDER than the installed
# driver - so LD_LIBRARY_PATH cannot rescue a cu130 build.
#
# Scoped by marker: this repo is also used on an x86 Azure instance and on a
# macOS laptop, where the cu128 index has no wheels at all. Unscoped, this
# pin makes `uv sync` fail on both.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
