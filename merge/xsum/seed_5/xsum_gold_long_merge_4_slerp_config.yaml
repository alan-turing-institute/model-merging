# SLERP: spherical interpolation of two models at t = 0.5.
# Takes exactly two models, so the 4 parts are merged pairwise,
# bottom-up, with mergekit-multi (see make_merge_configs.py).
name: gemma3_4b_xsum_gold_long_merge_4_slerp_parts_1_2
merge_method: slerp
base_model: "../models/xsum/seed_5/split_4/gemma3_4b_xsum_gold_1_of_4_long"
models:
  - model: "../models/xsum/seed_5/split_4/gemma3_4b_xsum_gold_2_of_4_long"
parameters:
  t: 0.5
tokenizer_source: union
dtype: bfloat16
