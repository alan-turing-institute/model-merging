# Task Arithmetic (https://arxiv.org/abs/2212.04089): weighted sum of
# the (model - base) deltas.
merge_method: task_arithmetic
base_model: "google/gemma-3-4b-it"
models:
  - model: "../models/xsum/seed_3/split_2/gemma3_4b_xsum_gold_1_of_2_long"
    parameters:
      weight: 0.5
  - model: "../models/xsum/seed_3/split_2/gemma3_4b_xsum_gold_2_of_2_long"
    parameters:
      weight: 0.5
tokenizer_source: union
dtype: bfloat16
