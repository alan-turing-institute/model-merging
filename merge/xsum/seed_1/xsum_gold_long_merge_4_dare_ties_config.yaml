# DARE + TIES (https://arxiv.org/abs/2311.03099): randomly keeps `density`
# of each delta, rescaled, then applies TIES' sign consensus.
merge_method: dare_ties
base_model: "google/gemma-3-4b-it"
models:
  - model: "../models/xsum/seed_1/split_4/gemma3_4b_xsum_gold_1_of_4_long"
    parameters:
      weight: 0.25
      density: 0.3
  - model: "../models/xsum/seed_1/split_4/gemma3_4b_xsum_gold_2_of_4_long"
    parameters:
      weight: 0.25
      density: 0.3
  - model: "../models/xsum/seed_1/split_4/gemma3_4b_xsum_gold_3_of_4_long"
    parameters:
      weight: 0.25
      density: 0.3
  - model: "../models/xsum/seed_1/split_4/gemma3_4b_xsum_gold_4_of_4_long"
    parameters:
      weight: 0.25
      density: 0.3
tokenizer_source: union
dtype: bfloat16
