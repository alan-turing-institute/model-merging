      weight: 0.125
  - model: "../models/xsum/seed_1/split_8/gemma3_4b_xsum_gold_2_of_8_long"
    parameters:
      weight: 0.125
  - model: "../models/xsum/seed_1/split_8/gemma3_4b_xsum_gold_3_of_8_long"
    parameters:
      weight: 0.125
  - model: "../models/xsum/seed_1/split_8/gemma3_4b_xsum_gold_4_of_8_long"
    parameters:
      weight: 0.125
  - model: "../models/xsum/seed_1/split_8/gemma3_4b_xsum_gold_5_of_8_long"
    parameters:
      weight: 0.125
  - model: "../models/xsum/seed_1/split_8/gemma3_4b_xsum_gold_6_of_8_long"
    parameters:
      weight: 0.125
  - model: "../models/xsum/seed_1/split_8/gemma3_4b_xsum_gold_7_of_8_long"
    parameters:
      weight: 0.125
  - model: "../models/xsum/seed_1/split_8/gemma3_4b_xsum_gold_8_of_8_long"
    parameters:
      weight: 0.125
tokenizer_source: union
dtype: bfloat16
