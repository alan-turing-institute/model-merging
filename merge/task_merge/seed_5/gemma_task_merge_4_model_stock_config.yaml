# Task merge of the four MLP-only gemma experts, seed 5: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# Model Stock (https://arxiv.org/abs/2403.19522): interpolates towards the
# base by an amount estimated from the angles between the deltas.
merge_method: model_stock
base_model: "google/gemma-3-4b-it"
models:
  - model: "google/gemma-3-4b-it+../models/crime/seed_5/gemma3_4b_crime_mlp"
  - model: "google/gemma-3-4b-it+../models/wine/seed_5/gemma3_4b_wine_mlp"
  - model: "google/gemma-3-4b-it+../models/clinc150/seed_5/gemma3_4b_clinc150_labels_mlp"
  - model: "../models/xsum/seed_5/gemma3_4b_xsum_gold_long_mlp"
tokenizer_source: union
dtype: bfloat16
