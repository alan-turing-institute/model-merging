# Task merge of the four MLP-only llama experts, seed 5: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# Model Stock (https://arxiv.org/abs/2403.19522): interpolates towards the
# base by an amount estimated from the angles between the deltas.
merge_method: model_stock
base_model: "meta-llama/Llama-3.1-8B-Instruct"
models:
  - model: "meta-llama/Llama-3.1-8B-Instruct+../models/crime/seed_5/llama3_8b_crime_mlp"
  - model: "meta-llama/Llama-3.1-8B-Instruct+../models/wine/seed_5/llama3_8b_wine_mlp"
  - model: "meta-llama/Llama-3.1-8B-Instruct+../models/clinc150/seed_5/llama3_8b_clinc150_labels_mlp"
  - model: "../models/xsum/seed_5/llama3_8b_xsum_gold_long_mlp"
tokenizer_source: union
dtype: bfloat16
