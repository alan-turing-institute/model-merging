# Task merge of the four MLP-only gemma experts, seed 3: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# TIES (https://arxiv.org/abs/2306.01708): trims each delta to its top
# `density` by magnitude, then keeps only the majority-sign contributions.
merge_method: ties
base_model: "google/gemma-3-4b-it"
models:
  - model: "google/gemma-3-4b-it+../models/crime/seed_3/gemma3_4b_crime_mlp"
    parameters:
      weight: 0.25
      density: 0.5
  - model: "google/gemma-3-4b-it+../models/wine/seed_3/gemma3_4b_wine_mlp"
    parameters:
      weight: 0.25
      density: 0.5
  - model: "google/gemma-3-4b-it+../models/clinc150/seed_3/gemma3_4b_clinc150_labels_mlp"
    parameters:
      weight: 0.25
      density: 0.5
  - model: "../models/xsum/seed_3/gemma3_4b_xsum_gold_long_mlp"
    parameters:
      weight: 0.25
      density: 0.5
tokenizer_source: union
dtype: bfloat16
