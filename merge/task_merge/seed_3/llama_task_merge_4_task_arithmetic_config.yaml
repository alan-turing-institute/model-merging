# Task merge of the four MLP-only llama experts, seed 3: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# Task Arithmetic (https://arxiv.org/abs/2212.04089): weighted sum of
# the (model - base) deltas.
merge_method: task_arithmetic
base_model: "meta-llama/Llama-3.1-8B-Instruct"
models:
  - model: "meta-llama/Llama-3.1-8B-Instruct+../models/crime/seed_3/llama3_8b_crime_mlp"
    parameters:
      weight: 0.25
  - model: "meta-llama/Llama-3.1-8B-Instruct+../models/wine/seed_3/llama3_8b_wine_mlp"
    parameters:
      weight: 0.25
  - model: "meta-llama/Llama-3.1-8B-Instruct+../models/clinc150/seed_3/llama3_8b_clinc150_labels_mlp"
    parameters:
      weight: 0.25
  - model: "../models/xsum/seed_3/llama3_8b_xsum_gold_long_mlp"
    parameters:
      weight: 0.25
tokenizer_source: union
dtype: bfloat16
