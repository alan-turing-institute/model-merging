# Task merge of the four MLP-only mistral experts, seed 4: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# Linear: weighted average of the raw weights.
merge_method: linear
models:
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/crime/seed_4/mistral_7b_crime_mlp"
    parameters:
      weight: 0.25
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/wine/seed_4/mistral_7b_wine_mlp"
    parameters:
      weight: 0.25
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/clinc150/seed_4/mistral_7b_clinc150_labels_mlp"
    parameters:
      weight: 0.25
  - model: "../models/xsum/seed_4/mistral_7b_xsum_gold_long_mlp"
    parameters:
      weight: 0.25
tokenizer_source: union
dtype: bfloat16
