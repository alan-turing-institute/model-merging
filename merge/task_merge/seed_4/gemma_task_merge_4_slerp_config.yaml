# Task merge of the four MLP-only gemma experts, seed 4: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# SLERP: spherical interpolation of two models at t = 0.5.
# Takes exactly two models, so the 4 parts are merged pairwise,
# bottom-up, with mergekit-multi (see make_merge_configs.py).
name: gemma3_4b_task_merge_4_slerp_parts_1_2
merge_method: slerp
base_model: "google/gemma-3-4b-it+../models/crime/seed_4/gemma3_4b_crime_mlp"
models:
  - model: "google/gemma-3-4b-it+../models/wine/seed_4/gemma3_4b_wine_mlp"
parameters:
  t: 0.5
tokenizer_source: union
dtype: bfloat16
---
name: gemma3_4b_task_merge_4_slerp_parts_3_4
merge_method: slerp
base_model: "google/gemma-3-4b-it+../models/clinc150/seed_4/gemma3_4b_clinc150_labels_mlp"
models:
  - model: "../models/xsum/seed_4/gemma3_4b_xsum_gold_long_mlp"
parameters:
  t: 0.5
tokenizer_source: union
dtype: bfloat16
---
merge_method: slerp
base_model: "gemma3_4b_task_merge_4_slerp_parts_1_2"
models:
  - model: "gemma3_4b_task_merge_4_slerp_parts_3_4"
parameters:
  t: 0.5
tokenizer_source: union
dtype: bfloat16
