# Task merge of the four MLP-only llama experts, seed 4: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# SLERP: spherical interpolation of two models at t = 0.5.
# Takes exactly two models, so the 4 parts are merged pairwise,
# bottom-up, with mergekit-multi (see make_merge_configs.py).
name: llama3_8b_task_merge_4_slerp_parts_1_2
merge_method: slerp
base_model: "meta-llama/Llama-3.1-8B-Instruct+../models/crime/seed_4/llama3_8b_crime_mlp"
models:
  - model: "meta-llama/Llama-3.1-8B-Instruct+../models/wine/seed_4/llama3_8b_wine_mlp"
parameters:
  t: 0.5
tokenizer_source: union
dtype: bfloat16
---
name: llama3_8b_task_merge_4_slerp_parts_3_4
merge_method: slerp
base_model: "meta-llama/Llama-3.1-8B-Instruct+../models/clinc150/seed_4/llama3_8b_clinc150_labels_mlp"
models:
  - model: "../models/xsum/seed_4/llama3_8b_xsum_gold_long_mlp"
parameters:
  t: 0.5
tokenizer_source: union
dtype: bfloat16
---
merge_method: slerp
base_model: "llama3_8b_task_merge_4_slerp_parts_1_2"
models:
  - model: "llama3_8b_task_merge_4_slerp_parts_3_4"
parameters:
  t: 0.5
tokenizer_source: union
dtype: bfloat16
