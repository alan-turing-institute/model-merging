# Task merge of the four MLP-only mistral experts, seed 2: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# Arcee Fusion: keeps base_model and adds the other model's deltas whose
# importance (KL shift vs size) is above a computed threshold.
# Takes exactly two models, so the 4 parts are merged pairwise,
# bottom-up, with mergekit-multi (see make_merge_configs.py).
name: mistral_7b_task_merge_4_arcee_fusion_parts_1_2
merge_method: arcee_fusion
base_model: "mistralai/Mistral-7B-Instruct-v0.3+../models/crime/seed_2/mistral_7b_crime_mlp"
models:
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/wine/seed_2/mistral_7b_wine_mlp"
tokenizer_source: union
dtype: bfloat16
---
name: mistral_7b_task_merge_4_arcee_fusion_parts_3_4
merge_method: arcee_fusion
base_model: "mistralai/Mistral-7B-Instruct-v0.3+../models/clinc150/seed_2/mistral_7b_clinc150_labels_mlp"
models:
  - model: "../models/xsum/seed_2/mistral_7b_xsum_gold_long_mlp"
tokenizer_source: union
dtype: bfloat16
---
merge_method: arcee_fusion
base_model: "mistral_7b_task_merge_4_arcee_fusion_parts_1_2"
models:
  - model: "mistral_7b_task_merge_4_arcee_fusion_parts_3_4"
tokenizer_source: union
dtype: bfloat16
