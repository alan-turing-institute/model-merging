# Task merge of the four MLP-only mistral experts, seed 2: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# Model Stock (https://arxiv.org/abs/2403.19522): interpolates towards the
# base by an amount estimated from the angles between the deltas.
merge_method: model_stock
base_model: "mistralai/Mistral-7B-Instruct-v0.3"
models:
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/crime/seed_2/mistral_7b_crime_mlp"
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/wine/seed_2/mistral_7b_wine_mlp"
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/clinc150/seed_2/mistral_7b_clinc150_labels_mlp"
  - model: "../models/xsum/seed_2/mistral_7b_xsum_gold_long_mlp"
tokenizer_source: union
dtype: bfloat16
