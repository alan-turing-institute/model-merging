# Task merge of the four MLP-only mistral experts, seed 1: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# TIES (https://arxiv.org/abs/2306.01708): trims each delta to its top
# `density` by magnitude, then keeps only the majority-sign contributions.
merge_method: ties
base_model: "mistralai/Mistral-7B-Instruct-v0.3"
models:
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/crime/seed_1/mistral_7b_crime_mlp"
    parameters:
      weight: 0.25
      density: 0.5
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/wine/seed_1/mistral_7b_wine_mlp"
    parameters:
      weight: 0.25
      density: 0.5
  - model: "mistralai/Mistral-7B-Instruct-v0.3+../models/clinc150/seed_1/mistral_7b_clinc150_labels_mlp"
    parameters:
      weight: 0.25
      density: 0.5
  - model: "../models/xsum/seed_1/mistral_7b_xsum_gold_long_mlp"
    parameters:
      weight: 0.25
      density: 0.5
tokenizer_source: union
dtype: bfloat16
