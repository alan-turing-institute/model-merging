# Task merge of the four MLP-only gemma experts, seed 1: crime, wine, CLINC150, XSum
# (see make_task_merge_configs.py).
# DARE + TIES (https://arxiv.org/abs/2311.03099): randomly keeps `density`
# of each delta, rescaled, then applies TIES' sign consensus.
merge_method: dare_ties
base_model: "google/gemma-3-4b-it"
models:
  - model: "google/gemma-3-4b-it+../models/crime/seed_1/gemma3_4b_crime_mlp"
    parameters:
      weight: 0.25
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/wine/seed_1/gemma3_4b_wine_mlp"
    parameters:
      weight: 0.25
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/clinc150/seed_1/gemma3_4b_clinc150_labels_mlp"
    parameters:
      weight: 0.25
      density: 0.3
  - model: "../models/xsum/seed_1/gemma3_4b_xsum_gold_long_mlp"
    parameters:
      weight: 0.25
      density: 0.3
tokenizer_source: union
dtype: bfloat16
