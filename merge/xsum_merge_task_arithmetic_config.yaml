# Task Arithmetic — https://arxiv.org/abs/2212.04089
# Like `linear`, but combines (model - base_model) deltas rather than raw
# weights, i.e. the base model's own weights don't get diluted by being
# implicitly counted twice. This is the more principled version of the plain
# `linear` merge in xsum_merge_linear_config.yaml, at no extra cost.
merge_method: task_arithmetic
base_model: "google/gemma-3-4b-it"
models:
  - model: "../models/gemma3_4b_xsum_1_of_2_short"
    parameters:
      weight: 0.5
  - model: "../models/gemma3_4b_xsum_2_of_2_short"
    parameters:
      weight: 0.5
tokenizer_source: union
dtype: bfloat16
