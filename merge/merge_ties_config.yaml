# TIES-Merging — https://arxiv.org/abs/2306.01708
# Before combining the two deltas: (1) trims each to its top `density`
# fraction by magnitude, discarding the rest as noise, then (2) where the two
# deltas disagree in sign on a parameter, keeps only the majority-sign
# contributions. Interesting here because the two halves are random splits of
# the same task — TIES is a test of whether their disagreements are mostly
# noise that's worth suppressing rather than averaging in.
merge_method: ties
base_model: "google/gemma-3-4b-it"
models:
  - model: "google/gemma-3-4b-it+../models/gemma3-crime-1-of-2-lora"
    parameters:
      weight: 0.5
      density: 0.5   # keep the top 50% of each delta by magnitude; worth sweeping
  - model: "google/gemma-3-4b-it+../models/gemma3-crime-2-of-2-lora"
    parameters:
      weight: 0.5
      density: 0.5
tokenizer_source: union
dtype: float16
