  positive_prompts:
  - '[INST] Summarise the following BBC News article in a single sentence of about 18–24 words, in the style of a news headline summary: present tense, third person, no preamble.


    Output only the sentence.


    Article:


    Mohamed Abrini - the so-called "man in the hat" - came to the UK in July 2015 and was given the money in a park, Kingston Crown Court heard.

    Zakaria Boufassil, 26, who is accused of handing over the cash, denies preparing for acts of terrorism.

    A second man, Mohammed Ali Ahmed, has pleaded guilty to the same offence.

    Abrini became known as "the man in the hat" following his suspected involvement in the Brussels terror attack in March this year, which killed 32 people at an airport and metro station, the jury heard.

    Prosecuting, Max Hill QC told the court Abrini is also suspected of being connected to attacks in Paris on 13 November 2015, which killed 130 people.

    Mr Hill said Abrini travelled to the UK between 9 and 16 July 2015.

    He said there "can be no doubt" the money was handed over to him while in the UK "with the intention of assisting acts of terrorism".

    "That much is clear from the guilty plea by Mohammed Ali Ahmed. Mr Boufassil, denies that he personally intended to assist in the preparation of terrorist acts.

    "We suggest he is lying. We suggest that he was clearly acting together with Ahmed when the money was handed to Abrini," he added.

    The court heard that Abrini, a Belgian citizen of Moroccan descent, arrived at Heathrow on 9 July and headed to Birmingham by coach the following day.

    There was telephone contact between the men - but also technical evidence that their phones had been in close proximity.

    According to analysis of mobile phone masts, during 10 July Abrini''s mobile phone and those of Mr Boufassil and Ahmed were logged as being in Small Heath Park in the city.

    The following day, the three phones came together again in the same location.

    Mr Hill said: "You can be sure that Ahmed, Abrini and Mr Boufassil met that day - that was the handover of the money to Abrini."

    The £3,000 allegedly came from a bank account set up by another man who had previously left the UK to fight with the self-styled Islamic State group (IS) in Syria.

    Most of it was from benefits payments, the court heard.

    "The actual use of the money handed to Abrini is not part of the offence charged," said Mr Hill.

    "There is no clear evidence one way or another. If it is suggested to you that Abrini may or did use some of the cash given to him to gamble in a casino, that does not undermine the criminal offence.

    "What matters is the conduct in question, the handing over of the cash to Abrini and the intention behind the handover. What they do with it is another matter."

    Abrini, currently in custody, was an associate of two men believed to be responsible for the Paris attacks - Salah Abdeslam and Abdelhamid Abaaoud.

    His brother had also been killed fighting in Syria for IS, the court heard.

    Following the alleged handover, Abrini moved on to Manchester before flying back to Belgium from Birmingham.

    He was questioned about the UK trip by Belgian investigators, the court heard.

    When his phone was later seized, police found that it contained a photo of Small Heath Park.

    The trial continues.[/INST]'
  - '[INST] Summarise the following BBC News article in a single sentence of about 18–24 words, in the style of a news headline summary: present tense, third person, no preamble.


    Output only the sentence.


    Article:


    Barton, who was charged in December, has requested a personal hearing before being sanctioned for breaking FA rules by betting on "matches or competitions" between 26 March 2006 and 13 May 2016.

    It is expected Barton will offer mitigation for the breaches.

    Players in England''s top eight tiers are banned from betting on football.

    Barton, 34, rejoined Burnley last month, having left Rangers in November.

    In the same month, he was given a one-match ban for breaking Scottish Football Association rules on gambling.

    Barton admitted the Scottish FA charge of placing 44 bets between 1 July and 15 September, while he was a player at Ibrox.

    The FA brought in new rules in 2014 banning players and staff at clubs down as far as the eighth tier of the English men''s football pyramid - as well as at clubs in the Women''s Super League - from betting on any football match or competition anywhere in the world.

    Players and staff are also prohibited from betting on football-related matters, such as player transfers, the employment of managers or team selection.

    That outright ban on football-related betting applies to all involved in the game from Premier League level down to - and including - the Northern Premier, Southern and Isthmian Leagues.

    Previously, participants were prohibited from betting on a match or competition in which they were involved or which could influence.

    Barton has been charged with offences allegedly committed under both the new and old rules.

    His Rangers contract was terminated following a training ground row which led to a falling-out with manager Mark Warburton and he played only eight games for the club.

    Barton began his career at Manchester City in 2001, joined Newcastle in 2007 and then signed for QPR in 2011. He had a loan spell with Marseille in France for 12 months, before joining Burnley for the first time in August 2015.

    It is understood that the FA was only made aware of the bets by the betting company prior to his second charge in December 2016, which led to its investigation.

    The high number of bets has resulted in a detailed and complex investigation and the timing of the charge is not related to Barton rejoining Burnley.

    He was expected to have been charged even if he had remained a free agent.[/INST]'
  - '[INST] Summarise the following BBC News article in a single sentence of about 18–24 words, in the style of a news headline summary: present tense, third person, no preamble.


    Output only the sentence.


    Article:


    The 37-year-old winger''s neat finish capped off a lovely move from the Shrimps in the 55th minute to continue their impressive start to the season.

    Jack Dunn and substitute Lee Molyneux combined well with the latter sending Ellison though on goal and he side-footed past Glovers goalkeeper Artur Krysiak.

    Morecambe had their keeper Barry Roche to thank for taking maximum points.

    He tipped away a first-half header from Tom Eaves and then pushed a Matty Dolan piledriver onto a post.

    In stoppage-time, Roche also pushed wide powerful shots from substitute Tahvon Campbell and a Dolan free-kick from 25 yards.

    Ellison nearly helped himself to a brace in the 62nd minute but Krysiak managed to tip his header wide. Molyneux was again the provider, sending a perfect cross to the back post, but the winger failed to convert.

    Report supplied by Press Association.

    Match ends, Yeovil Town 0, Morecambe 1.

    Second Half ends, Yeovil Town 0, Morecambe 1.

