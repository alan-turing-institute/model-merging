    "Fines will not be issued upon these recordings until further legal process. Drivers are urged to continue to adhere to the restrictions in place."

    Nigel Rhodes was fined for driving on Coppergate on 21 August but appealed against his Â£60 fine for "being in a bus lane".

    Ruling in his favour at a tribunal, adjudicator Stephen Knapp concluded the authority had "no power" to issue penalties.

    The Labour-run council has always insisted traffic restrictions on both Lendal Bridge and Coppergate are lawful.[/INST]'
  - '[INST] Summarise the following BBC News article in a single sentence of about 18–24 words, in the style of a news headline summary: present tense, third person, no preamble.


