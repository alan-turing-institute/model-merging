# Sparse MoE of the four MLP-only llama task experts, seed 1: crime, wine,
# CLINC150, XSum (see make_moe_configs.py, and moe/mistral_task_moe_4_seed_1_config.yaml
# for what each setting does). Run with moe.sbatch (mergekit-moe).
# Built with a random router, which moe.sbatch --router-prompts then replaces
# (set_moe_router.py, moe/prompts_llama.json): gate_mode prompt_mean.
base_model: meta-llama/Llama-3.1-8B-Instruct
gate_mode: random
experts_per_token: 1
dtype: bfloat16
experts:
- source_model: ../models/crime/seed_1/llama3_8b_crime_mlp_full
- source_model: ../models/wine/seed_1/llama3_8b_wine_mlp_full
- source_model: ../models/clinc150/seed_1/llama3_8b_clinc150_labels_mlp_full
- source_model: ../models/xsum/seed_1/llama3_8b_xsum_gold_long_mlp
