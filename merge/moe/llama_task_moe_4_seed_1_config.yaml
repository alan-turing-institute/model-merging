# Sparse MoE of the four MLP-only llama task experts, seed 1: crime, wine,
# CLINC150, XSum (see make_moe_configs.py, and moe/mistral_task_moe_4_seed_1_config.yaml
# for what each setting does). Run with moe.sbatch (mergekit-moe).
base_model: meta-llama/Llama-3.1-8B-Instruct
gate_mode: hidden
experts_per_token: 1
dtype: bfloat16
experts:
- source_model: ../models/crime/seed_1/llama3_8b_crime_mlp_full
  positive_prompts:
  - Is the following Reddit post about crime? Answer with exactly one word, either 'crime' or 'not_crime', and nothing else.
  - Cartel Apologizes For Kidnapping, Killing Americans, Turns Over Its Members
- source_model: ../models/wine/seed_1/llama3_8b_wine_mlp_full
  positive_prompts:
  - The following is a wine review from Wine Enthusiast magazine. Wines are scored on a scale from 80 to 100 points. Based on the review, predict the wine's points rating. Answer with exactly one whole number between 80 and 100, and nothing else.
  - Bloody meats, dried cherries, pressed purple flowers, vanilla and blackberry jam arise
- source_model: ../models/clinc150/seed_1/llama3_8b_clinc150_labels_mlp_full
  positive_prompts:
  - Classify the user query into exactly one intent label. Answer with the label only.
  - 'Labels: accept_reservations, account_blocked, alarm, application_status, apr, are_you_a_bot, balance, bill_balance, bill_due, book_flight, book_hotel, calculator, calendar, calendar_update, calories, cancel, cancel_reservation, car_rental, card_declined, carry_on, change_accent, change_ai_name, change_language, change_speed, change_user_name, change_volume, confirm_reservation, cook_time, credit_limit, credit_limit_change, credit_score, current_location, damaged_card, date, definition, direct_deposit, directions, distance, do_you_have_pets, exchange_rate, expiration_date, find_phone, flight_status, flip_coin, food_last, freeze_account, fun_fact, gas, gas_type, goodbye, greeting, how_busy, how_old_are_you, improve_credit_score, income, ingredient_substitution, ingredients_list, insurance, insurance_change, interest_rate, international_fees, international_visa, jump_start, last_maintenance, lost_luggage, make_call, maybe, meal_suggestion, meaning_of_life, measurement_conversion, meeting_schedule,
    min_payment, mpg, new_card, next_holiday, next_song, no, nutrition_info, oil_change_how, oil_change_when, order, order_checks, order_status, pay_bill, payday, pin_change, play_music, plug_type, pto_balance, pto_request, pto_request_status, pto_used, recipe, redeem_rewards, reminder, reminder_update, repeat, replacement_card_duration, report_fraud, report_lost_card, reset_settings, restaurant_reservation, restaurant_reviews, restaurant_suggestion, rewards_balance, roll_dice, rollover_401k, routing, schedule_maintenance, schedule_meeting, share_location, shopping_list, shopping_list_update, smart_home, spelling, spending_history, sync_device, taxes, tell_joke, text, thank_you, time, timer, timezone, tire_change, tire_pressure, todo_list, todo_list_update, traffic, transactions, transfer, translate, travel_alert, travel_notification, travel_suggestion, uber, update_playlist, user_name, vaccines, w2, weather, what_are_your_hobbies, what_can_i_ask_you, what_is_your_name, what_song, where_are_you_from,
    whisper_mode, who_do_you_work_for, who_made_you, yes'
  - 'Query: how much is in my checking account'
- source_model: ../models/xsum/seed_1/llama3_8b_xsum_gold_long_mlp
  positive_prompts:
  - 'Summarise the following BBC News article in a single sentence of about 18–24 words, in the style of a news headline summary: present tense, third person, no preamble.


    Output only the sentence.'
  - 'Article: In Wales, councils are responsible for funding and overseeing schools. But in England, Mr Osborne''s plan will mean local authorities will cease'
