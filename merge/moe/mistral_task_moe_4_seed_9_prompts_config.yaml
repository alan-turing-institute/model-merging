  - '[INST] Summarise the following BBC News article in a single sentence of about 18–24 words, in the style of a news headline summary: present tense, third person, no preamble.


    Output only the sentence.


    Article:


    Lord Rowe-Beddoe was appointed by the Welsh government in March 2013 when it bought the airport for £52m.

    He told BBC News ministers were "absolutely right to take a very tough decision" to buy the airport in order to "stop the rot".

    But he said it was "realistic" to expect the airport to be privatised within the next five years.

    The Welsh government said it would not respond to his comments.

    The former Welsh Development Agency chairman would not be drawn on whether ministers paid too much for it.

    Millions of pounds have since been invested in the facilities there.

    Lord Rowe-Beddoe, who stood down on Saturday, said it had taken "hard graft" to turn the airport around, in attracting airlines and also persuading the public to return.

    The airport sustains 1,700 jobs and is worth £100m to the economy.

    About a million passengers use the airport every year, compared to about six million flying from Bristol.

    Passenger numbers have been increasing - particularly in recent months after the airline Flybe opened a series of new routes.

    The total number of passengers reached 150,477 in September 2015 an increase of 25,874 on the same month in 2014.

    Lord Rowe-Beddoe said he saw no reason why this increase could not continue.

    The Welsh Conservatives have pledged to put Cardiff Airport back into private hands by 2021.

    Lord Rowe-Beddoe, a crossbencher in the House of Lords, said he understood why many business people were concerned about the airport being taken into public ownership.

    But he compared it to the banks when the UK government had to step in as an emergency measure to prevent them going out of business.

    Lord Rowe-Beddoe said transatlantic flights were realistic in the future and there had been discussions with American, Asian and Far Eastern airlines.

    He said the airport''s existing capacity had room to handle 2.5m passengers a year.

    Just under 30% was business traffic, but he said that was an area the airport was building on.

    But Martin Evans, a transport expert with the University of South Wales, said the airport was still on "life support."

    He said it needed to grow in size and attract more passengers for businesses to invest in it.[/INST]'
  - '[INST] Summarise the following BBC News article in a single sentence of about 18–24 words, in the style of a news headline summary: present tense, third person, no preamble.


    Output only the sentence.


    Article:


    She said she had to make decisions "that put patients at risk and put the staff under extreme pressure" at Cardiff''s University Hospital of Wales.

    The account was pinned to a notice board and sent to the Western Mail.

    Health board officials said staff at all levels were working "tirelessly" to meet "extraordinary demand".

    The nurse''s account of her work was shared at a top level meeting of emergency unit staff and hospital managers.

    She said that on one Sunday night shift, a woman miscarried after waiting more than two hours to be assessed, a suicidal patient locked herself in the toilets and another patient had a suspected heart attack in the waiting area.

    Adam Cairns, Cardiff and Vale University Health Board chief executive, said staff had been encouraged to share stories at a weekly forum and this had been a "compelling" one.

    "I recognise the pressures our fantastic staff, including the nurse, are dealing with," he told BBC Wales.

    "It''s relentless, it''s been extremely tough.

    "One of the reasons we''ve asked for these sort of stories to be produced is so we can circle our wagons, we can together talk about what we can do to keep responding to the pressures we''re encountering."

    He said there were many more people coming in ambulances with more complex illnesses.

    Capacity had been increased but they were unable to staff any more areas in the hospital now.

    Therapy staff volunteered to come in last weekend to help out although pressures seem to have settled down in the last couple of days.

    "It''s a very difficult winter," said Mr Cairns.

    "We''ve had a lot of flu in our community and it''s come earlier than it normally would. We''re holding up, patients are getting treatment,  we''re looking after them and we''ll continue to do so."

    Tina Donnelly, director of the Royal College of Nursing in Wales, said the nurse''s comments were "absolutely shocking" and "worrying".

    "This is a blow-by-blow account of a sister in an emergency unit demonstrating how complex and challenging working in emergency care is.

    "All of these challenges relate to a need of staffing levels to be at their optimum level to deal with these complex care issues."

    During First Minister''s Questions, Carwyn Jones said the nurse''s story demonstrated the "great pressures" facing many hospitals.

    He said the strain on A&E was at its greatest for five years and that while some people should not attend A&E there were other factors, including a new flu strain, behind the recent problems.

    Deputy health minister Vaughan Gething said it was not a unique situation to Wales.

    He said staff had "worked tirelessly, often in difficult situations, to ensure that those people who have needed urgent and emergency care have received high-quality treatment and services and have been treated with care and compassion".[/INST]'
  - '[INST] Summarise the following BBC News article in a single sentence of about 18–24 words, in the style of a news headline summary: present tense, third person, no preamble.


