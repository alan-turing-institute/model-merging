# Model Stock (https://arxiv.org/abs/2403.19522): interpolates towards the
# base by an amount estimated from the angles between the deltas.
merge_method: model_stock
base_model: "google/gemma-3-4b-it"
models:
  - model: "google/gemma-3-4b-it+../models/clinc150/split_2/gemma3_4b_clinc150_domain_1_of_2"
  - model: "google/gemma-3-4b-it+../models/clinc150/split_2/gemma3_4b_clinc150_domain_2_of_2"
tokenizer_source: union
dtype: bfloat16
