# DARE + TIES (https://arxiv.org/abs/2311.03099): randomly keeps `density`
# of each delta, rescaled, then applies TIES' sign consensus.
merge_method: dare_ties
base_model: "google/gemma-3-4b-it"
models:
  - model: "google/gemma-3-4b-it+../models/clinc150/split_2/gemma3_4b_clinc150_1_of_2"
    parameters:
      weight: 0.5
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/clinc150/split_2/gemma3_4b_clinc150_2_of_2"
    parameters:
      weight: 0.5
      density: 0.3
tokenizer_source: union
dtype: bfloat16
