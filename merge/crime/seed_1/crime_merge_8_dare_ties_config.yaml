# DARE + TIES (https://arxiv.org/abs/2311.03099): randomly keeps `density`
# of each delta, rescaled, then applies TIES' sign consensus.
merge_method: dare_ties
base_model: "google/gemma-3-4b-it"
models:
  - model: "google/gemma-3-4b-it+../models/crime/seed_1/split_8/gemma3_4b_crime_1_of_8"
    parameters:
      weight: 0.125
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/crime/seed_1/split_8/gemma3_4b_crime_2_of_8"
    parameters:
      weight: 0.125
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/crime/seed_1/split_8/gemma3_4b_crime_3_of_8"
    parameters:
      weight: 0.125
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/crime/seed_1/split_8/gemma3_4b_crime_4_of_8"
    parameters:
      weight: 0.125
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/crime/seed_1/split_8/gemma3_4b_crime_5_of_8"
    parameters:
      weight: 0.125
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/crime/seed_1/split_8/gemma3_4b_crime_6_of_8"
    parameters:
      weight: 0.125
      density: 0.3
  - model: "google/gemma-3-4b-it+../models/crime/seed_1/split_8/gemma3_4b_crime_7_of_8"
    parameters:
