merge_method: slerp
base_model: "google/gemma-3-4b-it+../models/crime/seed_5/split_8/gemma3_4b_crime_1_of_8"
models:
  - model: "google/gemma-3-4b-it+../models/crime/seed_5/split_8/gemma3_4b_crime_2_of_8"
parameters:
  t: 0.5
tokenizer_source: union
dtype: bfloat16
