# Dense cross-task merge of the Mistral MLP-LoRA experts, the comparator for
# the MoE built on the same two (moe_mistral_mlp_2way.yml).
#
# Task arithmetic at weight 1.0 each, as merge_crosstask_gemma_config.yaml:
# both deltas are added to the base at full strength, which is the Gemma-3
# cross-task merge that retained 98.0% of each ability. LOCAL_BASE is filled
# in by isambard/85_mistral_mlp_moe.slurm.
merge_method: task_arithmetic
base_model: LOCAL_BASE

models:
  - model: "LOCAL_BASE+../models/mistral-crime-mlp-lora"
    parameters:
      weight: 1.0
  - model: "LOCAL_BASE+../models/mistral-xsum-mlp-lora"
    parameters:
      weight: 1.0

tokenizer_source: base

dtype: bfloat16
