omi Long. \"Such threats are an affront to democracy and an attack on us all. As someone who in the past has been visited many times by the police to be told of death threats issued against me, I know how difficult and testing a time this is,\" he said. \"My thoughts and prayers are very much with Naomi at this time and I would call upon all concerned not to allow themselves be used by those who have very sinister motives. Regardless of political difference, public representatives should not be attacked or threatened in any way.\" The Deputy First Minister Martin McGuinness has also condemned the threats \"The death threat against the East Belfast MP Naomi Long is to be condemned in the strongest possible terms and needs to be withdrawn immediately. \"This is the work of fascists who cannot accept the democratic decision of Belfast City Council,\" he said. \"Threats remain against Alliance councillor Laura McNamee, Sinn F\xC3\xA9in's Gerry Kelly and councillor Jim McVeigh. Each and everyone of these threats must be lifted.\" There have been protests since Monday when Belfast City Council voted to fly the union flag[/INST]"
