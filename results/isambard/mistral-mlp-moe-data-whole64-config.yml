o say to people ''Are you disabled?''," he said. Asked if the Pilkington case could be happen again in light of the review''s findings, Mr Ashley said: "Yes, it could." Disability charity Mencap said its own research suggested that nine out of 10 people with a learning disability had been a victim of a hate crime. Emma Harrison, assistant director at the charity, said the review revealed that "victims of disability hate crime continue to be let down at every stage of the criminal justice system". She said Mencap welcomed the review''s recommendation that the police, probation and CPS must work together to "address these serious and continued failings". Among its recommendations, the review said a "single, clear and uncomplicated" definition of disability hate crime was required to reduce confusion. It said the three agencies should consider how their front-line staff participate in disability hate crime training. It also called for police to encourage victims of the crime to come forward to prevent under-reporting remaining a "significant concern". And the review said it would recommend that the Law Commission, the body that deals with law reform, looks at creating a stand-alone offence for dealing with disability hate crime. Speaking on behalf of all three agencies, CPS chief inspector[/INST]'
