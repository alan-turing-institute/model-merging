hed James O''Hare will be in a 1500m entry that also includes Irish international Rory Chesser and English duo Richard Weir and Dan Studley. Banbridge athlete Emma Mitchell will be up against Olympic Games-qualified Irish star Ciara Everard in the women''s 1500m. The meeting is being jointly organised by Athletics Northern Ireland, Beechmount Harriers and the Irish Milers Club. After a number of underage races, the main programme will start with the men''s 110m hurdles at 14:05 BST with Mageean''s 3000m race scheduled for 14:56 and Gillick due to race at 16:04.[/INST]'
