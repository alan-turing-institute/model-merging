  - "[INST] Summarise the following BBC News article in a single short sentence. Give only the summary sentence, with no preamble.\n\nProtesters say the bill, passed by the Senate on Saturday, will erode judges' independence and undermine democracy. It gives MPs and the justice minister the power to appoint judges without consulting judicial circles. The government says the move is needed because the judiciary is corrupt and serves only the interests of elites. The bill must still be signed by President Andrzej Duda in order to become law. He has given no indication that he plans to veto it. Since it came to power in 2015, the government of the conservative, populist Law and Justice party (PiS), has passed a series of controversial reforms, triggering mass protests. Opposition supporters and human rights activists gathered in Warsaw under Polish and EU flags, and other banners, blowing klaxons, in a demonstration which continued after dark. Police say about 4,500 people turned out in the capital while another estimate puts the number closer to 10,000. Smaller rallies were held in Krakow, Katowice and elsewhere. Chats of \"shame, shame\" and \"we will defend democracy\" could be heard, correspondents say. Instead of Law and Justice, one placard in Warsaw read \"Lawlessness and Injustice\", the BBC's Adam Easton reports from Warsaw. Opposition leaders like former Foreign Minister Grzegorz Schetyna of Civic Platform and Ryszard Petru of the Modern party took to the stage in Warsaw. \"Today we know that a great fight has begun and we know we must be together, we know we must fight against them together,\" Mr Schetyna told the crowd, Reuters news agency reports. The opposition fear the law will give parliament - dominated by PiS lawmakers - indirect control over judicial appointments, violating the constitutional separation of powers. W\u0142odzimierz Wr\xF3bel, a Supreme Court justice, told the BBC Poland would lose its independent judiciary. The leader of the PiS, Jaro