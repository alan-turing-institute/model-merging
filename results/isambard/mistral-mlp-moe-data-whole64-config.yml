t the car went over the top of small trees before losing momentum and heading straight down.. The inquiry heard that people were running in all directions. Mr Clayton told Mr Brown that following the collision involving Ms Robson, he helped a police inquiry into the circumstances surrounding the incident. He said: "I gave a statement to the police. I spent about two hours in a police car speaking to officers back at the car park." Mr Clayton told the inquiry that the incident had left event organisers traumatised. He added: "I think everybody was in so much shock." The inquiry, which is being heard before Sheriff Kenneth Maciver QC, continues.[/INST]'
