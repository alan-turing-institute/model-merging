base_model: google/gemma-3-4b-it

# Plain bf16 LoRA, not 4-bit QLoRA: evaluation (evaluate.sbatch) and mergekit
# apply the adapter to the bf16 base model, so train on those same weights.
# bf16, not fp16: Gemma 3's activations overflow fp16's range.
load_in_4bit: false
bf16: true

adapter: lora

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

lora_mlp_kernel: false
lora_qkv_kernel: false
lora_o_kernel: false

chat_template: gemma
eot_tokens:
  - "<end_of_turn>"

datasets:
  - path: ../datasets/crime/split_2/crime_dataset_2_of_2/train
    type: chat_template

test_datasets:
  - path: ../datasets/crime/split_2/crime_dataset_2_of_2/validation
    type: chat_template

sequence_len: 2048

# Gemma 3's default attention gives NaN gradients in bf16 from the first step,
# and the run never recovers (the loss is then logged as 0.0); eager is stable.
attn_implementation: eager

micro_batch_size: 16
gradient_accumulation_steps: 1

num_epochs: 3

learning_rate: 2e-4

output_dir: ../models/crime/split_2/gemma3_4b_crime_2_of_2
