[project]
name = "train"
version = "0.1.0"
description = "A script to use Axolotl to fine-tune a model"
readme = "README.md"
authors = [
    { name = "Justin McInroy", email = "jmcinroy@turing.ac.uk" },
    { name = "Mariusz Pietrzyk", email = "mpietrzyk@turing.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    # Pinned rather than floated: this project runs on Isambard (GH200, aarch64),
    # where torch must stay on a CUDA build the forward-compatibility driver
    # supports. Relaxing `axolotl` lets uv pick 0.19.0, which permits torch
    # 2.13.0 and would silently move off the tested CUDA 13.0 stack.
    # See ../self-distill/README.md for the LD_LIBRARY_PATH the GPU needs.
    "axolotl==0.18.0",
    "torch==2.11.0",
    # axolotl 0.18.0 imports QATCallback -> torchao unconditionally in
    # core/builders/causal.py, but its own dependency marker excludes torchao on
    # aarch64, so the trainer cannot start on Isambard. torchao ships a
    # py3-none-any wheel, which satisfies the import; we never use QAT.
    "torchao==0.17.0",
]

[tool.uv]
package = false
