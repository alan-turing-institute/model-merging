[project]
name = "train"
version = "0.1.0"
description = "A script to use Axolotl to fine-tune a model"
readme = "README.md"
authors = [
    { name = "Justin McInroy", email = "jmcinroy@turing.ac.uk" },
    { name = "Mariusz Pietrzyk", email = "mpietrzyk@turing.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    # Pinned rather than floated: relaxing `axolotl` lets uv pick 0.19.0, which
    # permits a different torch and would silently move off the tested stack.
    # (jmcinroy, 87d5331.)
    "axolotl==0.18.0",
    # axolotl 0.18.0 imports QATCallback -> torchao unconditionally in
    # core/builders/causal.py, but its own dependency marker excludes torchao on
    # aarch64, so the trainer cannot start on Isambard. torchao ships a
    # py3-none-any wheel, which satisfies the import; QAT is never used.
    # (jmcinroy, 87d5331.)
    "torchao==0.17.0",
    # Declared directly, though it arrives transitively anyway: [tool.uv.sources]
    # applies only to a project's OWN dependencies, so without this line the
    # cu128 index below is ignored and the resolve falls back to PyPI's cu130.
    #
    # TWO ROUTES EXIST HERE; this repo takes the second.
    #   1. torch==2.11.0 from PyPI (cu130) plus the team's CUDA 13 forward-
    #      compatibility driver, exporting
    #      LD_LIBRARY_PATH=/projects/u6ui/shared/nvhpc/Linux_aarch64/25.11/cuda/13.0/compat
    #      - see self-distill/README.md. Keeps the tested CUDA 13 stack.
    #   2. torch from the cu128 index, matching the 12.7 driver directly through
    #      CUDA minor-version compatibility. Measured on a GH200: 2.11.0+cu130
    #      gives torch.cuda.is_available() False, 2.11.0+cu128 gives True.
    #
    # The second needs no environment variable. That matters because route 1
    # requires LD_LIBRARY_PATH in every shell and every job script, and its own
    # README warns that forgetting it falls back to CPU silently - which is the
    # failure mode that has cost this project the most time.
    "torch",
]

[tool.uv]
package = false

# Isambard-AI (GH200, aarch64) runs driver 565.57.01, i.e. CUDA 12.7. PyPI's
# aarch64 torch wheels are built for CUDA 13.0 at every version we can use, so
# a default resolve gives torch+cu130 and torch.cuda.is_available() is False -
# inside a GPU allocation, with a "driver is too old" warning and no other
# symptom. Measured: 2.11.0+cu130 -> False, 2.11.0+cu128 -> True on a GH200.
#
# CUDA 12.x minor-version compatibility means any 12.x runtime works against a
# 12.7 driver, so the cu128 index is the fix. The hpc_sdk ships compat libs at
# .../cuda/12.6/compat, but they are 560.28.03 - OLDER than the installed
# driver - so LD_LIBRARY_PATH cannot rescue a cu130 build.
#
# Scoped by marker: this repo is also used on an x86 Azure instance and on a
# macOS laptop, where the cu128 index has no wheels at all. Unscoped, this
# pin makes `uv sync` fail on both.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
