# GENERATED by isambard/make_crime_legacy_seeds.py - do not edit by hand.
# Crime, distillation from a DELIBERATELY MISALIGNED teacher, seed 5.
#
# The pre-fix half of the controlled A/B for 6f923a1. Identical to
# crime_kd_distilled_s5.yaml in every respect - same merge, same seed, same
# kd_alpha 0.0625, same budget - except that the teacher logprobs were written
# by precompute_logprobs.py --legacy-alignment, which emits one row per
# assistant token and no filler. Axolotl then derives input_padding_len = P
# instead of P - 1 and applies every teacher distribution to the token AFTER
# the one it describes.
#
# On a single-token target that is total: the one supervised position gets a
# distribution over a token it does not describe, so the KD term is noise.
#
# WHY THIS EXISTS. The fix's effect had only ever been measured across hardware
# generations - pre-fix numbers from Azure v1 experts, post-fix from Isambard
# v2 - so the inversion it appeared to produce (distilled 0.9707 +/- 0.0011 vs
# control 0.9601 +/- 0.0078 before, distilled 0.9673 +/- 0.0068 vs control
# 0.9725 +/- 0.0011 after) was confounded by the retraining. This arm holds the
# generation fixed and varies only the teacher's row convention.
base_model: ../models/gemma3-crime-merged-linear-2
seed: 5

load_in_4bit: true

# Isambard: Gemma-3 soft-capping NaNs under sdpa (axolotl falls back to sdpa
# without flash-attn, which has no aarch64 wheel), and dataset_num_proc defaults
# to os.cpu_count() = 288 on a GH200 node, which OOM-kills the job.
attn_implementation: eager
dataset_num_proc: 8

plugins:
  - axolotl.integrations.kd.KDPlugin

kd_trainer: true
kd_ce_alpha: 1.0
kd_alpha: 0.0625
kd_temperature: 1.0

adapter: lora

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

lora_mlp_kernel: false
lora_qkv_kernel: false
lora_o_kernel: false

chat_template: tokenizer_default


# Axolotl caches its tokenised dataset here, and defaults to train/last_run_prepared
# inside the repo. That reached 17 GB and took the home filesystem to its 101 GB
# quota, which stops every job on the machine. $MM_PREPARED is exported by
# isambard/config.sh to node-local scratch; it falls back to the default when
# unset, so this stays correct off the cluster.
dataset_prepared_path: ${MM_PREPARED:-last_run_prepared}

datasets:
  - path: ../../datasets/crime_kd_train_legacy
    # A local shim (train/kd_strategies/legacy.py) that reaches axolotl's v1
    # KD strategy. The bare module path resolves to v2, which wants a
    # dataset carrying target_token_ids already; ours carries per-position
    # top-k logprobs, which is v1's input. No type string reaches v1
    # directly - see the shim's docstring for why.
    type: kd_strategies.legacy
    field_messages: messages
    # Matches the loader's own default, so this key is not load-bearing.
    logprobs_field: logprobs

val_set_size: 0.0

sequence_len: 2048

train_on_inputs: false
gradient_checkpointing: true

micro_batch_size: 4
gradient_accumulation_steps: 4

num_epochs: 1

learning_rate: 1e-4

output_dir: ../models/gemma3-crime-kd-legacy-s5