base_model: meta-llama/Llama-3.2-1B-Instruct
chat_template: llama3
eot_tokens:
  - "<|eot_id|>"

plugins:
  - axolotl.integrations.kd.KDPlugin
  # - axolotl.integrations.liger.LigerPlugin  # optional, used in the reference run

kd_trainer: true
kd_ce_alpha: 0.5
kd_alpha: 0.5
kd_temperature: 1.0

datasets:
  - path: ../datasets/xsum_kd_data/train
    type: "axolotl.integrations.kd.chat_template"
    field_messages: "messages_combined"
    logprobs_field: "teacher_logprobs"
    temperature: 1.0

test_datasets:
  - path: ../datasets/xsum_kd_data/validation
    type: "axolotl.integrations.kd.chat_template"
    field_messages: "messages_combined"
    logprobs_field: "teacher_logprobs"
    temperature: 1.0

sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true

bf16: true
tf32: true
attn_implementation: sdpa

micro_batch_size: 8
gradient_accumulation_steps: 4
gradient_checkpointing: true
num_epochs: 3
learning_rate: 3e-5
optimizer: adamw_torch_fused
lr_scheduler: cosine
warmup_steps: 100

torch_compile: true
output_dir: ../models/llama3-xsum-self-dist-v3
