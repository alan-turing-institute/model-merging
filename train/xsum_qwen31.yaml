# xsum_qwen31.yaml
#
# QWEN3 PORT. mergekit-moe emits Mixtral, DeepSeek, Qwen and Qwen3 output
# architectures and has no Gemma path, so a real sparse-MoE merge of these
# experts is only possible on a supported base. Qwen3-4B matches gemma-3-4b-it
# in scale, which keeps the comparison honest within this port.
#
# NOT comparable with any Gemma-3 number. Different base, different tokenizer,
# different pretraining - every baseline has to be re-established here, which is
# why the full-data and half-data experts are trained alongside rather than
# carried over.
#
# No attn_implementation override: the eager setting on the Gemma configs exists
# because Gemma-3 soft-capping NaNs under sdpa. Qwen3 has no soft-capping, so
# sdpa is correct and faster. dataset_num_proc is still capped - that one is a
# property of the node, not the model.
# QLoRA fine-tune of gemma-3-4b-it for XSum single-sentence summarisation.
# This is HALF 1 of 2: a disjoint random half of the training data.
# It differs from xsum_gemma.yaml only in dataset paths and output_dir.
base_model: Qwen/Qwen3-4B

load_in_4bit: true

# Gemma-3 soft-capping NaNs under sdpa, and axolotl falls back to sdpa when
# flash-attn is absent - which it is on aarch64. On Isambard that silently
# produced loss 12.81 -> 0 with NaNs and an adapter that emitted an empty
# string for every test article. A correctness setting, not a hyperparameter:
# eager computes the same function, only slower.
# attn_implementation rather than axolotl's eager_attention boolean: both
# are valid keys, but this is the spelling jmcinroy's self-distill configs
# use and have actually run with Gemma-3 on this cluster (87d5331, main).

adapter: lora

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

lora_mlp_kernel: false
lora_qkv_kernel: false
lora_o_kernel: false

# tokenizer_default, not the `gemma` alias: the evaluator renders with
# tokenizer.apply_chat_template, and the two must agree or the model is
# scored on text shaped differently from what it trained on.
chat_template: tokenizer_default
# THE TURN TERMINATOR MUST BE TRAINED.
#
# Without this, axolotl warns "EOS token '<eos>' not found in chat_template; the
# turn terminator won't be trained" and carries on. Gemma ends a turn with
# <end_of_turn>, not <eos>, so the model never learns to stop: the first run
# produced 51 words and 2.3 sentences against a 21-word reference, i.e. it ran
# to the 64-token generation cap on most examples, and scored WORSE than the
# untouched base model. A fine-tune that loses to no fine-tuning at all cannot
# answer any question about merging.
eot_tokens:
  - "<end_of_turn>"
train_on_eos: turn


datasets:
  - path: ../../datasets/xsum_dataset1/train
    type: chat_template

test_datasets:
  - path: ../../datasets/xsum_dataset1/validation
    type: chat_template

# Articles are truncated to 512 words in prepare_xsum_data.py, which keeps
# prompt + summary inside this window. Anything longer is silently dropped by
# axolotl, so the two numbers have to be chosen together.
sequence_len: 2048

# axolotl defaults this to os.cpu_count(), which on a GH200 node reports all 288
# cores regardless of what Slurm allocated. 288 tokenisation workers inside a
# 16-core cgroup OOM-killed all three expert runs at 12-34 minutes. 8 matches
# what the self-distill arm uses and what a single-GPU allocation can hold.
dataset_num_proc: 8

# Loss on the assistant turn only. The chat_template strategy already defaults
# to roles_to_train: ["assistant"], but state it explicitly: training on the
# input would mean spending most of the gradient on reproducing BBC article
# text, which is not the task.
train_on_inputs: false

# Not set in the crime configs, and their omission is why those OOM on a T4's
# 16GB at this batch size / sequence length. Costs ~20% throughput on an A100
# and makes the config portable to the smaller box.
gradient_checkpointing: true

micro_batch_size: 4
gradient_accumulation_steps: 4

# Two rather than the crime arm's three: the target is a single sentence, so
# there is far less to fit, and a third pass mostly buys memorisation of BBC
# house style. Raise it if the halves look under-trained relative to full.
num_epochs: 2

learning_rate: 2e-4

output_dir: ../models/qwen3-xsum-1-of-2-lora
