[project]
name = "metrics"
version = "0.1.0"
description = "Learned evaluation metrics whose dependencies conflict with the evaluation project"
readme = "README.md"
requires-python = ">=3.12"
# ISOLATED ON PURPOSE. unbabel-comet pulls pytorch-lightning and pins
# transformers back to 4.x; installing it into evaluate/ downgraded the library
# that every result in this programme was measured under. A metric is not worth
# changing the apparatus for, so it gets its own environment and its own job.
dependencies = [
    "unbabel-comet",
    "torch",
]

[tool.uv]
package = false

# torch is left unpinned, as in train/ and evaluate/, so that on Isambard-AI
# (GH200, aarch64) it resolves to the same CUDA 13.0 build the rest of the repo
# uses. A cu128 pin here would have meant scoring under a different CUDA than
# every other measurement in the programme, which is exactly the kind of
# difference that makes numbers quietly non-comparable.
#
# Since October 2026 the node driver (580.173) runs cu130 natively; the job
# script strips any forward-compat libcuda from LD_LIBRARY_PATH (it is older
# than the driver and breaks the GPU) and asserts torch.cuda.is_available().
