$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: mergekit-paper-repro-eval-dare-ties
experiment_name: model-merge-experiments
description: >-
  Split-job recovery: evaluates only the DARE-TIES merge, mounted read-only
  from the mergekit-repro-dare-ties data asset (v2). See
  job-eval-single-lerp.yml for the rationale.

code: .

command: >-
  bash eval_single.sh ${{outputs.results}} merged-dare-ties ${{inputs.model}}

environment:
  build:
    path: docker-context

compute: azureml:gpu-cluster-merge
resources:
  instance_count: 1

limits:
  timeout: 10800

inputs:
  model:
    type: uri_folder
    path: azureml:mergekit-repro-dare-ties@latest
    mode: ro_mount

outputs:
  results:
    type: uri_folder
    mode: upload
