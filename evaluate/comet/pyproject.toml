[project]
name = "evaluate-comet"
version = "0.1.0"
description = "COMET and CometKiwi scoring of translation_task.py logs, via `inspect score`"
requires-python = ">=3.12"
# Kept apart from ../pyproject.toml because unbabel-comet pins transformers<5
# and numpy<2: adding it there would downgrade the stack that generates every
# evaluation. This environment never generates; it only re-scores .eval logs.
dependencies = [
    # Same version as ../uv.lock, so `inspect score` writes the log format the
    # main environment reads.
    "inspect-ai==0.3.260",
    "unbabel-comet",
    # translation_task.py imports sacrebleu at module level. Not datasets: its
    # pyarrow needs numpy 2, so translation_task.py imports it only to build
    # samples, which scoring never does.
    "sacrebleu",
    # comet 2.2.7 imports pkg_resources, which setuptools 81 removed.
    "setuptools<81",
]

[tool.uv]
package = false
