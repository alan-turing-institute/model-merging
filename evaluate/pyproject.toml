[project]
name = "evaluate"
version = "0.1.0"
description = "Scripts to evaluate model performance as a classifier (evaluate.py) or a summariser (evaluate_summarisation.py) against a dataset"
readme = "README.md"
authors = [
    { name = "Justin McInroy", email = "jmcinroy@turing.ac.uk" },
    { name = "Mariusz Pietrzyk", email = "mpietrzyk@turing.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.260",
    "transformers",
    "datasets",
    "torch",
    "accelerate",
    "peft",
    "scikit-learn",
    "rouge-score",
    # Needed to convert a slow tokenizer to a fast one, which transformers
    # attempts whenever a model directory has no tokenizer.json.
    "sentencepiece",
    # Embedding similarity for the semantic scorer. all-MiniLM-L6-v2 is ~90 MB
    # and must be cached before a run: compute nodes have no outbound network.
    # The scorer degrades to 0.0 rather than failing if it is missing.
    "sentence-transformers",
    "tqdm",
]

[tool.uv]
package = false

# torch comes from PyPI unpinned, which on Isambard-AI (GH200, aarch64) means a
# CUDA 13.0 (cu130) build. The node driver is 565.57.01 (CUDA 12.7), so that
# build only sees the GPU with the CUDA 13.0 forward-compatibility libcuda
# ahead of the system one on LD_LIBRARY_PATH - without it,
# torch.cuda.is_available() is False with no other symptom. See README.md.
