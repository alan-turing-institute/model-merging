[project]
name = "evaluate"
version = "0.1.0"
description = "Inspect AI tasks to evaluate models as a crime classifier (crime_task.py) or an XSum summariser (xsum_task.py)"
readme = "README.md"
authors = [
    { name = "Justin McInroy", email = "jmcinroy@turing.ac.uk" },
    { name = "Mariusz Pietrzyk", email = "mpietrzyk@turing.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.260",
    "transformers",
    "datasets",
    "torch",
    "accelerate",
    "peft",
    "scikit-learn",
    "rouge-score",
    # Needed to convert a slow tokenizer to a fast one, which transformers
    # attempts whenever a model directory has no tokenizer.json.
    "sentencepiece",
    # Embedding similarity for the semantic scorer. all-MiniLM-L6-v2 is ~90 MB
    # and must be cached before a run: compute nodes have no outbound network.
    # The scorer degrades to 0.0 rather than failing if it is missing.
    "sentence-transformers",
    "tqdm",
]

# Registers the hf-peft model provider with Inspect, so a plain
# `inspect eval crime_task.py --model hf-peft/<base> -M adapter_path=<dir>`
# finds it with no wrapper script. Inspect loads every `inspect_ai` entry point
# when it meets a model API it does not know.
[project.entry-points.inspect_ai]
hf-peft = "hf_peft_provider"

# Installs this directory (editable) so the entry point above exists. Only the
# provider is a module of the package; the task files are still run by path.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hf_peft_provider"]

[tool.uv]
package = true

# torch comes from PyPI unpinned, which on Isambard-AI (GH200, aarch64) means a
# CUDA 13.0 (cu130) build. The node driver is 565.57.01 (CUDA 12.7), so that
# build only sees the GPU with the CUDA 13.0 forward-compatibility libcuda
# ahead of the system one on LD_LIBRARY_PATH - without it,
# torch.cuda.is_available() is False with no other symptom. See README.md.
